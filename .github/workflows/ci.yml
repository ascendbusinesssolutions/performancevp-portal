name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each package's suite is a separately named check, so a red engine suite is visible as exactly
# that and can be a required check on its own. No secrets are stored in GitHub at Milestone 0.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [engine, intake, recommendations, portal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @performancevp/${{ matrix.package }} test

  # The copy check (PORTAL_COPY_SPEC.md Sections 6 and 7): the lint over every copy table, every
  # template fixture and the Supabase Auth email templates. Also part of test (portal); named on
  # its own so it can be a required check.
  copy:
    name: copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm copy

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
        env:
          APP_ENV: staging

  # The sign-in paths, the consoles and the directory, in a browser against the local stack built
  # from the migrations and the dev seed. The keys are the Supabase CLI's fixed local keys, read
  # from the running stack; nothing here is a stored secret.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local
      APP_BASE_URL: http://localhost:3000
      CRON_SECRET: ci-local-cron-secret
      SURVEY_TOKEN_SECRET: ci-local-survey-token-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm exec supabase start -x studio,postgres-meta,imgproxy
      - name: Point the portal at the local stack
        run: |
          pnpm exec supabase status -o json > "$RUNNER_TEMP/stack.json"
          {
            echo "SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/stack.json")"
            echo "SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/stack.json")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY "$RUNNER_TEMP/stack.json")"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm --filter @performancevp/portal exec playwright install --with-deps chromium
      - run: pnpm --filter @performancevp/portal e2e
      - if: always()
        run: pnpm exec supabase stop --no-backup
