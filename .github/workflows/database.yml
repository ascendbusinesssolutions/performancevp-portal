name: Database

# Runs only when the database layer changes, until Milestone 3 writes the first migration.
# From then on the path filter is removed and this becomes a required check.
on:
  pull_request:
    paths:
      - supabase/**
      - .github/workflows/database.yml
      - .github/actions/setup-workspace/**
  push:
    branches: [main]
    paths:
      - supabase/**
      - .github/workflows/database.yml
      - .github/actions/setup-workspace/**

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # Only Postgres is needed: a fresh database built from the migrations alone, then pgTAP and lint.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db lint
      - run: pnpm exec supabase test db
      - if: always()
        run: pnpm exec supabase stop --no-backup
