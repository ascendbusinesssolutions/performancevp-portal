name: Database

# Runs on every pull request and push to main, and is a required check from Milestone 3: the
# migrations, the schema lint, the pgTAP suite and the generated types, from a fresh database.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # Only Postgres is needed: a fresh database built from the migrations alone, then pgTAP and lint.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db lint
      - run: pnpm exec supabase test db
      # The committed types must be what the migrations generate; regenerate with `pnpm db:types`.
      - name: Generated types match the migrations
        run: |
          pnpm exec supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u apps/portal/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - if: always()
        run: pnpm exec supabase stop --no-backup
