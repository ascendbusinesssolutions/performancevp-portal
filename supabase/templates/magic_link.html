<!doctype html>
<html lang="en-AU">
  <body
    style="
      margin: 0;
      padding: 32px 24px;
      background: #ffffff;
      font-family: Helvetica, Arial, sans-serif;
      color: #1f3a52;
    "
  >
    <p
      style="
        margin: 0 0 24px;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #82693f;
      "
    >
      PerformanceVP
    </p>
    <h1
      style="
        margin: 0 0 16px;
        font-family: Georgia, &quot;Times New Roman&quot;, serif;
        font-size: 24px;
        font-weight: normal;
      "
    >
      Your sign-in code
    </h1>
    <p style="margin: 0 0 8px; font-size: 15px; line-height: 1.6">
      Enter this code on the page where you asked for it.
    </p>
    <p
      style="
        margin: 0 0 24px;
        font-family: &quot;Courier New&quot;, monospace;
        font-size: 32px;
        letter-spacing: 6px;
      "
    >
      {{ .Token }}
    </p>
    <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #5c6670">
      It lasts one hour and works once.
    </p>
    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5c6670">
      If you did not ask for a code, ignore this email. Nothing changes.
    </p>
  </body>
</html>
